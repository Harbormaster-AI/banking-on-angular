
<div class="d-flex justify-content-between align-items-center mb-3">
	<h5 class="mb-0">RiskAssessment List</h5>

	<a
			[routerLink]="['/createRiskAssessment']"
			class="btn btn-primary btn-sm">
		Create RiskAssessment
	</a>
</div>

<div class="table-responsive">
	<table class="table table-hover table-striped table-bordered table-sm">
		<thead>
		<tr class="table-dark text-center">
									<th scope="col">score</th>
						<th scope="col">assessedOn</th>
						<th scope="col">Rating</th>
						<th scope="col" colspan="2">Actions</th>
		</tr>
		</thead>

		<tbody>
			<tr
				*ngFor="let riskAssessment of riskAssessments"
				class="text-center">

								<td class="align-middle">
					{{ riskAssessment.score }}
				</td>
								<td class="align-middle">
					{{ riskAssessment.assessedOn }}
				</td>
								<td class="align-middle">
					{{ riskAssessment.Rating }}
				</td>
				
				<td class="align-middle">
					<a
							[routerLink]="['/editRiskAssessment', riskAssessmentriskAssessmentId]"
							class="btn btn-primary btn-sm">
						Edit
					</a>
				</td>

				<td class="align-middle">
					<button
							type="button"
							(click)="deleteRiskAssessment(riskAssessment.riskAssessmentId)"
							class="btn btn-danger btn-sm">
						Delete
					</button>
				</td>

			</tr>

			
			<tr *ngIf="riskAssessments?.length === 0">
				<td
						colspan="5"
						class="text-center">
					No riskAssessments found.
				</td>
			</tr>

		</tbody>
	</table>
</div>
