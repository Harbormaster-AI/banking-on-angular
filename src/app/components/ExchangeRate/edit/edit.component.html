<div class="panel panel-primary">
	<div class="panel-heading">
    	<h5>{{ title }}</h5>
	</div>
	
	<div class="panel-body">
 		<mat-form-field appearance="legacy">
    		<mat-label>baseCurrency</mat-label>
		    <input matInput ngDefaultControl placeholder="baseCurrency" name="exchangeRate.baseCurrency" [(ngModel)]="exchangeRate.baseCurrency">
    		<mat-hint></mat-hint>
  		</mat-form-field>
<p>
 		<mat-form-field appearance="legacy">
    		<mat-label>counterCurrency</mat-label>
		    <input matInput ngDefaultControl placeholder="counterCurrency" name="exchangeRate.counterCurrency" [(ngModel)]="exchangeRate.counterCurrency">
    		<mat-hint></mat-hint>
  		</mat-form-field>
<p>
 		<mat-form-field appearance="legacy">
    		<mat-label>rate</mat-label>
		    <input matInput ngDefaultControl placeholder="rate" name="exchangeRate.rate" [(ngModel)]="exchangeRate.rate">
    		<mat-hint></mat-hint>
  		</mat-form-field>
<p>
 		<mat-form-field appearance="legacy">
		    <mat-label>asOf</mat-label>
		  	<input matInput ngDefaultControl [matDatepicker]="picker" placeholder="asOf" name="exchangeRate.asOf" [(ngModel)]="exchangeRate.asOf">
			<mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
			<mat-datepicker #picker></mat-datepicker>
			<mat-hint></mat-hint>
		</mat-form-field>
<p>
 		<mat-form-field appearance="legacy">
    		<mat-label>source</mat-label>
		    <input matInput ngDefaultControl placeholder="source" name="exchangeRate.source" [(ngModel)]="exchangeRate.source">
    		<mat-hint></mat-hint>
  		</mat-form-field>
<p>
   		<mat-form-field appearance="legacy">
    		<mat-label>Bank</mat-label>
			<mat-select placeholder="Bank"   [compareWith]="compareFn"  [(ngModel)]="exchangeRate.Bank">
		    	<mat-option name="exchangeRate.Bank" ngDefaultControl  
		    		*ngFor="let bank of banks"		    		 
		    		[value]="bank._id">
		      		{{bank.name}}
		    	</mat-option>
		  	</mat-select>
		</mat-form-field>
<p>
   		<mat-form-field appearance="legacy">
    		<mat-label>FxTrades</mat-label>
			<mat-select placeholder="FxTrades" multiple  [compareWith]="compareFn"  [(ngModel)]="exchangeRate.FxTrades">
		    	<mat-option name="exchangeRate.FxTrades" ngDefaultControl  
		    		*ngFor="let fXTrade of fXTrades"		    		 
		    		[value]="fXTrade._id">
		      		{{fXTrade.tradeReference}}
		    	</mat-option>
		  	</mat-select>
		</mat-form-field>
<p>
                      <button 
		    (click)="updateExchangeRate(exchangeRate.baseCurrency, exchangeRate.counterCurrency, exchangeRate.rate, exchangeRate.asOf, exchangeRate.source, exchangeRate.Bank, exchangeRate.FxTrades)" 
		    class="btn btn-primary">update
		</button>
	</div> <!-- panel body -->	
</div> <!-- panel panel-primary -->
