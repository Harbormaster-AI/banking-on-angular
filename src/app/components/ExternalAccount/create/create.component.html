<div class="panel panel-primary">
	<div class="panel-heading">
    	<h5>{{ title }}</h5>
	</div>
	
	<div class="panel-body">
		<mat-form-field appearance="legacy">
    		<mat-label>name</mat-label>
		    <input matInput ngDefaultControl placeholder="name" name="externalAccount.name" [(ngModel)]="externalAccount.name">
    		<mat-hint></mat-hint>
  		</mat-form-field>
<p>
		<mat-form-field appearance="legacy">
    		<mat-label>iban</mat-label>
		    <input matInput ngDefaultControl placeholder="iban" name="externalAccount.iban" [(ngModel)]="externalAccount.iban">
    		<mat-hint></mat-hint>
  		</mat-form-field>
<p>
		<mat-form-field appearance="legacy">
    		<mat-label>accountNumber</mat-label>
		    <input matInput ngDefaultControl placeholder="accountNumber" name="externalAccount.accountNumber" [(ngModel)]="externalAccount.accountNumber">
    		<mat-hint></mat-hint>
  		</mat-form-field>
<p>
		<mat-form-field appearance="legacy">
    		<mat-label>bic</mat-label>
		    <input matInput ngDefaultControl placeholder="bic" name="externalAccount.bic" [(ngModel)]="externalAccount.bic">
    		<mat-hint></mat-hint>
  		</mat-form-field>
<p>
		<mat-form-field appearance="legacy">
    		<mat-label>bankName</mat-label>
		    <input matInput ngDefaultControl placeholder="bankName" name="externalAccount.bankName" [(ngModel)]="externalAccount.bankName">
    		<mat-hint></mat-hint>
  		</mat-form-field>
<p>
		<mat-form-field appearance="legacy">
    		<mat-label>country</mat-label>
		    <input matInput ngDefaultControl placeholder="country" name="externalAccount.country" [(ngModel)]="externalAccount.country">
    		<mat-hint></mat-hint>
  		</mat-form-field>
<p>
		<mat-form-field appearance="legacy">
    		<mat-label>Customer</mat-label>
			<mat-select placeholder="Customer"  [(ngModel)]="externalAccount.Customer">
		    	<mat-option name="externalAccount.Customer" ngDefaultControl  
		    		*ngFor="let customer of customers"		    		 
		    		[value]="customer._id">
		      		{{customer.firstName}}
		    	</mat-option>
		  	</mat-select>
		</mat-form-field>
<p>
		<mat-form-field appearance="legacy">
    		<mat-label>Transactions</mat-label>
			<mat-select placeholder="Transactions" multiple [(ngModel)]="externalAccount.Transactions">
		    	<mat-option name="externalAccount.Transactions" ngDefaultControl  
		    		*ngFor="let transaction of transactions"		    		 
		    		[value]="transaction._id">
		      		{{transaction.bookingDate}}
		    	</mat-option>
		  	</mat-select>
		</mat-form-field>
<p>
                <button 
		    (click)="addExternalAccount(externalAccount.name, externalAccount.iban, externalAccount.accountNumber, externalAccount.bic, externalAccount.bankName, externalAccount.country, externalAccount.Customer, externalAccount.Transactions)" 
		    class="btn btn-primary">add
		</button>
	</div> <!-- panel body -->	
</div> <!-- panel panel-primary -->
